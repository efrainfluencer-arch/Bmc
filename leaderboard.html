<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ranking • BMC</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="leaderboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
        rel="stylesheet">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="container">

            <a href="index.html" class="logo">

                <img src="logo.png" alt="BMC Logo">

                <div class="logo-text">

                    <h2>BMC</h2>

                    <span>Brazil MCBE Community</span>

                </div>

            </a>

            <nav>
                <a href="index.html">Início</a>
                <a href="leaderboard.html" class="active">Ranking</a>
                <a href="torneios.html">Torneios</a>
                <a href="noticias.html">Notícias</a>
                <a href="sociais.html">Sociais</a>
                <a href="staff.html">Equipe</a>
            </nav>

            <a href="https://discord.gg/FF2jSv7P2C"
                target="_blank"
                rel="noopener noreferrer"
                class="discord-btn">

                <i class="ri-discord-fill" aria-hidden="true"></i>
                <span class="discord-label">Discord</span>

            </a>

        </div>

    </header>

    <main>

        <!-- ================= HERO ================= -->

        <section class="leaderboard-hero">

            <div class="container">

                <span class="badge">

                    Ranking Oficial

                </span>

                <h1>

                    Ranking

                </h1>

                <p>

                    Descubra os melhores jogadores competitivos de Minecraft Bedrock do Brasil.

                </p>

            </div>

        </section>

      <section class="leaderboard-stats">

    <div class="container">

        <div class="stats-grid">

            <div class="stat-card">
                <h2 id="total-players">0</h2>
                <span>Jogadores</span>
            </div>

            <div class="stat-card">
                <h2>8</h2>
                <span>Modos</span>
            </div>

            <div class="stat-card">
                <h2 id="mobile-count">0</h2>
                <span>Celular</span>
            </div>

            <div class="stat-card">
                <h2 id="pc-count">0</h2>
                <span>Teclado</span>
            </div>

            <div class="stat-card">
                <h2 id="controller-count">0</h2>
                <span>Controle</span>
            </div>

        </div>

    </div>

      </section>

        <!-- ================= FILTERS ================= -->

        <section class="leaderboard-filters">

            <div class="container filters">

                <div class="search-box">

                    <i class="ri-search-line"></i>

                    <input
                        type="text"
                        placeholder="Buscar jogador...">

                </div>

                <div class="filters-row">

    <div class="filter-item">

        <label>Dispositivo</label>

        <select id="device-filter">

            <option value="todos">Todos os dispositivos</option>
            <option value="mobile">Celular</option>
            <option value="pc">Teclado e Mouse</option>
            <option value="controller">Controle</option>

        </select>

    </div>

    <div class="filter-item">

        <label>Modo</label>

        <select id="mode-filter">

            <option value="overall">Geral</option>

            <option value="BedFight">BedFight</option>
            <option value="Boxing">Block Fight</option>
            <option value="Build UHC">Build UHC</option>
            <option value="Mid Fight">Mid Fight</option>
            <option value="NodeBuff">NodeBuff</option>
            <option value="SkyWars">SkyWars</option>
            <option value="Sumo">Sumo</option>
            <option value="Survival Games">Survival Games</option>
            
        </select>

    </div>

                </div>

                <div class="filters-row bmc-extra-filters">
                    <div class="filter-item">
                        <label for="ranking-type-filter">Ranking</label>
                        <select id="ranking-type-filter">
                            <option value="tiers">Tiers</option>
                            <option value="elo">Elo Ranqueado</option>
                        </select>
                    </div>
                    <div class="filter-item" id="season-filter-wrap" hidden>
                        <label for="season-filter">Temporada</label>
                        <select id="season-filter">
                            <option value="current">Temporada atual</option>
                        </select>
                    </div>
                </div>
                <div id="ranked-season-status" class="ranked-season-status" hidden></div>
            </div>

        </section>

        <!-- ================= TOP 3 ================= -->

<section class="top-three">

    <div class="container">

        <h2 class="section-title">
            Top 3 Players
        </h2>

        <div id="top-three-container" class="top-three-grid">

            <!-- JavaScript -->

        </div>

    </div>

</section>

<!-- ================= PLAYERS ================= -->

<section class="players-list">

    <div class="container">

        <h2 class="section-title">
            Ranking
        </h2>

        <div id="leaderboard-list" class="leaderboard-grid">

            <!-- Conteúdo carregado pelo JavaScript -->
        </div>

    </div>

</section>

<!-- ================= PLAYER MODAL ================= -->

<div id="player-modal" class="player-modal">

    <div class="player-modal-overlay" onclick="fecharPlayerModal()"></div>

    <div class="player-modal-content">

        <button
            class="modal-close"
            onclick="fecharPlayerModal()">

            <i class="ri-close-line"></i>

        </button>

        <div id="player-modal-body">

            <!-- Conteúdo carregado pelo JavaScript -->

        </div>

    </div>

</div>
      
    </main>
    <script type="module" src="leaderboard.js"></script>

</body>
</html>
